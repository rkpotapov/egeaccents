<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тренажёр ударений · ЕГЭ 2026</title>
<style>
  :root{
    --bg:#0b1120;
    --line:rgba(148,163,184,.16);
    --txt:#e6edf7;
    --muted:#8ea0bd;
    --accent:#7c9cff;
    --good:#34d399;
    --bad:#f87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(900px 520px at 12% -12%, #1d2b4d 0%, transparent 62%),
      radial-gradient(760px 520px at 102% -4%, #2a1d4d 0%, transparent 58%),
      var(--bg);
    color:var(--txt);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 64px;
  }
  .app{width:100%;max-width:760px}

  header{margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
  h1{font-size:20px;margin:0;font-weight:650;letter-spacing:.01em}
  .sub{margin:6px 0 0;color:var(--muted);font-size:13.5px}

  .stats{display:flex;gap:10px;margin:20px 0 12px}
  .stat{
    flex:1;background:rgba(21,30,49,.75);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;text-align:center;
  }
  .stat b{display:block;font-size:19px;font-weight:650}
  .stat span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

  .bar{height:6px;background:rgba(148,163,184,.13);border-radius:99px;overflow:hidden;margin-bottom:22px}
  .bar i{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#7c9cff,#34d399);transition:width .35s ease}

  .card{
    background:linear-gradient(180deg,rgba(24,34,56,.92),rgba(19,27,45,.92));
    border:1px solid var(--line);
    border-radius:22px;
    padding:30px 28px 26px;
    box-shadow:0 30px 70px -40px #000;
  }
  .q-label{
    font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);text-align:center;
  }
  .word{
    font-size:clamp(30px,6.4vw,46px);
    font-weight:650;letter-spacing:.01em;text-align:center;
    margin:16px 0 4px;word-break:break-word;line-height:1.15;
  }
  .note{
    text-align:center;color:var(--muted);font-size:13px;min-height:18px;margin-bottom:4px;
  }

  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}
  @media(max-width:560px){.options{grid-template-columns:1fr}}

  .opt{
    position:relative;
    padding:15px 16px 15px 46px;
    font-size:20px;font-family:inherit;letter-spacing:.01em;
    color:var(--txt);
    background:linear-gradient(180deg,#1e2a44,#18223a);
    border:1px solid var(--line);
    border-radius:14px;
    cursor:pointer;text-align:left;
    transition:transform .13s ease,border-color .13s ease,box-shadow .13s ease,background .2s;
    word-break:break-word;
  }
  .opt:hover:not(:disabled){border-color:#4b6bd6;transform:translateY(-2px);
    box-shadow:0 10px 26px -14px #4b6bd6}
  .opt:disabled{cursor:default;opacity:1}
  .opt .num{
    position:absolute;left:14px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;display:grid;place-items:center;
    font-size:11px;color:var(--muted);
    border:1px solid var(--line);border-radius:6px;
  }
  .hl{color:#ffd166}
  .opt.good{background:linear-gradient(180deg,#0f3d31,#0b2f26);border-color:var(--good)}
  .opt.good .hl{color:#7dffc4}
  .opt.bad{background:linear-gradient(180deg,#481c1c,#381515);border-color:var(--bad)}
  .opt.bad .hl{color:#ffb4b4}

  .feedback{margin-top:18px;text-align:center;font-size:15px;min-height:22px}
  .feedback .ok{color:var(--good);font-weight:600}
  .feedback .err{color:var(--bad);font-weight:600}
  .feedback b{color:#ffd166}

  .reset{
    display:block;margin:22px auto 0;
    background:transparent;border:1px solid var(--line);color:var(--muted);
    padding:9px 18px;border-radius:11px;font-family:inherit;font-size:13.5px;cursor:pointer;
    transition:.15s;
  }
  .reset:hover{color:var(--txt);border-color:#4b6bd6}

  .finish{text-align:center;padding:14px 4px}
  .finish h2{margin:0 0 10px;font-size:26px}
  .finish p{color:var(--muted);margin:8px 0;font-size:14.5px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 6px}
  .chip{
    background:rgba(124,156,255,.1);border:1px solid rgba(124,156,255,.3);
    padding:5px 11px;border-radius:99px;font-size:14px;
  }
  .chip .hl{color:#ffd166}
  .btn-primary{
    margin-top:20px;padding:12px 24px;border-radius:12px;border:0;cursor:pointer;
    font-family:inherit;font-size:15px;font-weight:600;color:#0b1120;
    background:linear-gradient(90deg,#7c9cff,#5ee0b0);
  }
  .btn-primary:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span><h1>Тренажёр ударений</h1></div>
    <p class="sub">Задание 4 ЕГЭ · Орфоэпический список 2026</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="s-learned">0</b><span>выучено</span></div>
    <div class="stat"><b id="s-left">0</b><span>осталось</span></div>
    <div class="stat"><b id="s-acc">—</b><span>точность</span></div>
  </div>

  <div class="bar"><i id="bar"></i></div>

  <main class="card" id="card">
    <div class="q-label">Выберите верное ударение</div>
    <div class="word" id="word">—</div>
    <div class="note" id="note"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </main>

  <button class="reset" id="reset">Сбросить прогресс</button>
</div>

<script>
/* ============================================================
   ДАННЫЕ: полная база Орфоэпического списка ЕГЭ 2026.
   Заглавная буква обозначает ударную гласную.
   ============================================================ */
const DATA = [
  /* ——— Имена существительные ——— */
  "аэропОрты","бАнты","бОроду","бухгАлтеров","вероисповЕдание","водопровОд",
  "газопровОд","граждАнство","дефИс","дешевИзна","диспансЕр","договорЁнность",
  "докумЕнт","досУг","еретИк","жалюзИ","знАчимость","Иксы","каталОг","квартАл",
  "киломЕтр","кОнусов","корЫсть","крАны","кремЕнь","кремнЯ","лЕкторов","лОктя",
  "локтЕй","лыжнЯ","мЕстностей","намЕрение","нЕдруг","недУг","некролОг",
  "нЕнависть","нефтепровОд","новостЕй","нОгтя","ногтЕй",
  {w:"Отзыв", note:"о книге — «отклик, мнение, рецензия»"},
  {w:"отзЫв", note:"посла из страны — действие по глаголу отозвАть"},
  "Отрочество","партЕр","портфЕль","придАное","призЫв","свЁкла","сирОты",
  "созЫв","сосредотОчение","срЕдства","стАтуя","столЯр","тамОжня","тОрты",
  "тУфля","цемЕнт","цЕнтнер","цепОчка","шАрфы","шофЁр","экспЕрт",

  /* ——— Имена прилагательные ——— */
  "вернА","знАчимый","красИвее","красИвейший","кУхонный","ловкА","мозаИчный",
  "оптОвый","прозорлИвый","прозорлИва","слИвовый",

  /* ——— Глаголы ——— */
  "бралА","бралАсь","взялА","взялАсь","влилАсь","ворвалАсь","воспринЯть",
  "воспринялА","воссоздалА","вручИт","гналА","гналАсь","добралА","добралАсь",
  "дождалАсь","дозвонИтся","дозИровать","ждалА","закУпорить","занЯть","зАнял",
  "занялА","зАняли","заперлА","запломбировАть","защемИт","звалА","звонИт",
  "кАшлянуть","клАла","клЕить","кралАсь","кровоточИть","лгалА","лилА","лилАсь",
  "наделИт","надорвалАсь","назвалАсь","накренИтся","налилА","нарвалА","начАть",
  "нАчал","началА","нАчали","обзвонИт","облегчИть","облегчИт","облилАсь",
  "обнялАсь","обогналА","ободралА","ободрИть","ободрИт","ободрИться",
  "ободрИтся","обострИть","одолжИть","одолжИт","озлОбить","оклЕить","окружИт",
  "опОшлить","освЕдомиться","освЕдомится","отбылА","отдалА","откУпорить",
  "отозвалА","отозвалАсь","перезвонИт","перелилА","плодоносИть","пломбировАть",
  "повторИт","позвалА","позвонИт","полилА","положИть","положИл","понЯть",
  "понялА","послАла","прибЫть","прИбыл","прибылА","прИбыли","принЯть","прИнял",
  "принялА","прИняли","рвалА","сверлИт","снялА","создалА","сорвалА","убралА",
  "углубИть","укрепИт","чЕрпать","щемИт","щЕлкать",

  /* ——— Причастия и отглагольные прилагательные ——— */
  "довезЁнный","зАгнутый","зАнятый","занятА","зАпертый","заселЁнный","заселенА",
  "кровоточАщий","нажИвший","налИвший","нанЯвшийся","начАвший","нАчатый",
  "низведЁнный","облегчЁнный","ободрЁнный","обострЁнный","отключЁнный",
  "повторЁнный","поделЁнный","понЯвший","прИнятый","принятА","приручЁнный",
  "прожИвший","снятА","сОгнутый","углублЁнный",

  /* ——— Деепричастия ——— */
  "закУпорив","начАв","начАвшись","отдАв","понЯв","прибЫв","создАв",

  /* ——— Наречия ——— */
  "вОвремя","дОверху","дОнизу","дОсуха","зАсветло","надОлго","ненадОлго"
];

/* ============================================================
   ПАРСИНГ
   ============================================================ */
const VOWELS = "аеёиоуыэюя";

function parseEntry(raw){
  let plain = "", stressIdx = -1, stressIsYo = false;
  for (const ch of raw){
    if (ch === "Ё"){ stressIdx = plain.length; stressIsYo = true; plain += "ё"; }
    else if (ch !== ch.toLowerCase()){ stressIdx = plain.length; plain += ch.toLowerCase(); }
    else plain += ch;
  }
  return {
    raw,
    plain,
    display: plain.replace(/ё/g, "е"),
    stressIdx,
    stressIsYo,
    note: ""
  };
}

const ITEMS = (() => {
  const seen = new Set();
  const out = [];
  for (const d of DATA){
    const raw = typeof d === "string" ? d : d.w;
    if (seen.has(raw)) continue;
    seen.add(raw);
    const it = parseEntry(raw);
    it.note = typeof d === "string" ? "" : (d.note || "");
    out.push(it);
  }
  return out;
})();

/* ============================================================
   ХЕЛПЕРЫ
   ============================================================ */
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function vowelPositions(word){
  const p = [];
  for (let i = 0; i < word.length; i++) if (VOWELS.includes(word[i])) p.push(i);
  return p;
}

function renderWord(item, idx){
  const w = item.display;
  const ch = (idx === item.stressIdx && item.stressIsYo)
    ? "Ё"
    : w[idx].toUpperCase();
  return esc(w.slice(0, idx)) + '<b class="hl">' + ch + '</b>' + esc(w.slice(idx + 1));
}

function buildOptions(item){
  const vowels = vowelPositions(item.display);
  const others = shuffle(vowels.filter(p => p !== item.stressIdx));
  const picked = others.slice(0, Math.min(3, others.length));
  const all = shuffle([item.stressIdx, ...picked]);
  return all.map(idx => ({
    idx,
    ok: idx === item.stressIdx,
    html: renderWord(item, idx)
  }));
}

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const cardEl     = document.getElementById("card");
const CARD_HTML  = cardEl.innerHTML;
const elWord     = () => document.getElementById("word");
const elNote     = () => document.getElementById("note");
const elOptions  = () => document.getElementById("options");
const elFeedback = () => document.getElementById("feedback");

let queue = [], current = null, options = [];
let learned = 0, attempts = 0, correctCount = 0, total = 0;
let mistakes = new Set();
let locked = false;

/* ============================================================
   ЛОГИКА
   ============================================================ */
function start(){
  queue = shuffle(ITEMS.slice());
  total = ITEMS.length;
  learned = 0; attempts = 0; correctCount = 0;
  mistakes = new Set();
  current = null; options = []; locked = false;
  updateStats();
  next();
}

function next(){
  locked = false;
  if (queue.length === 0){ finish(); return; }
  current = queue.shift();
  options = buildOptions(current);
  renderQuestion();
}

function renderQuestion(){
  elWord().textContent = current.display;
  elNote().textContent = current.note || "";

  const box = elOptions();
  box.innerHTML = "";
  options.forEach((o, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="num">' + (i + 1) + '</span>' + o.html;
    if (o.ok) b.dataset.correct = "1";
    b.addEventListener("click", () => answer(o, b));
    box.appendChild(b);
  });

  elFeedback().innerHTML = "";
  updateStats();
}

function answer(opt, btn){
  if (locked) return;
  locked = true;
  attempts++;

  const all = [...elOptions().querySelectorAll(".opt")];
  all.forEach(b => (b.disabled = true));

  if (opt.ok){
    correctCount++;
    learned++;
    btn.classList.add("good");
    elFeedback().innerHTML = '<span class="ok">Верно!</span>';
    updateStats();
    setTimeout(next, 620);
  } else {
    mistakes.add(current);
    btn.classList.add("bad");
    all.forEach(b => { if (b.dataset.correct === "1") b.classList.add("good"); });

    const right = options.find(o => o.ok).html;
    elFeedback().innerHTML = '<span class="err">Неверно.</span> Правильно: <b>' + right + '</b>';

    const pos = Math.min(queue.length, 3 + Math.floor(Math.random() * 5));
    queue.splice(pos, 0, current);

    updateStats();
    setTimeout(next, 1700);
  }
}

function updateStats(){
  const left = total - learned;
  document.getElementById("s-learned").textContent = learned;
  document.getElementById("s-left").textContent = left;
  document.getElementById("s-acc").textContent =
    attempts ? Math.round((correctCount / attempts) * 100) + "%" : "—";
  document.getElementById("bar").style.width =
    total ? (learned / total) * 100 + "%" : "0%";
}

function finish(){
  const acc = attempts ? Math.round((correctCount / attempts) * 100) : 100;
  const chips = [...mistakes].map(it => '<span class="chip">' + renderWord(it, it.stressIdx) + '</span>').join("");

  cardEl.innerHTML =
    '<div class="finish">' +
      '<h2>Готово! 🎉</h2>' +
      '<p>Отработано слов: <b style="color:#e6edf7">' + total + '</b></p>' +
      '<p>Всего ответов: ' + attempts + ' · точность: ' + acc + '%</p>' +
      (mistakes.size
        ? '<p style="margin-top:18px">Слова, в которых были ошибки:</p><div class="chips">' + chips + '</div>'
        : '<p style="color:#34d399">Ни одной ошибки — отличный результат!</p>') +
      '<button class="btn-primary" id="again">Пройти заново</button>' +
    '</div>';

  document.getElementById("again").addEventListener("click", reset);
  document.getElementById("bar").style.width = "100%";
}

function reset(){
  cardEl.innerHTML = CARD_HTML;
  start();
}

/* ============================================================
   УПРАВЛЕНИЕ
   ============================================================ */
document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Сбросить прогресс и начать заново?")) reset();
});

document.addEventListener("keydown", e => {
  if (locked) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4){
    const btns = elOptions().querySelectorAll(".opt");
    if (btns[n - 1]) btns[n - 1].click();
  }
});

start();
</script>
</body>
</html>
